[project]
name = "studyhub-api"
version = "0.1.0"
description = "StudyHub backend — personal learning plan system"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # ORM + 迁移
    "SQLAlchemy>=2.0.35",
    "alembic>=1.13",
    "aiosqlite>=0.20",            # async SQLite driver (M0-M4)
    # Pydantic / 配置
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # HTTP / AI
    "httpx>=0.27",
    "openai>=1.50",
    # 工具
    "python-dateutil>=2.9",
    "tzdata>=2024.2",             # Windows 上 ZoneInfo 需要的 tz 数据库
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
# M5 启动时切到 PG 时再启用：
# pg = [
#     "asyncpg>=0.29",
#     "pgvector>=0.3",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]   # 行长由格式化控制

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
